<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Sci-Hub Settings</title>
    <style>
      .setting-row {
        display: flex;
        align-items: center;
        margin: 8px 0;
      }
      .setting-row label {
        margin-right: 8px;
        min-width: 160px;
      }
      .setting-row input[type="text"] {
        flex: 1;
        max-width: 300px;
      }
      .settings-group {
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="settings-group">
      <div class="setting-row">
        <label for="id-zoteroscihub-automatic-pdf-download">Automatic PDF Download:</label>
        <input type="checkbox" id="id-zoteroscihub-automatic-pdf-download" />
      </div>
    </div>
    <div class="settings-group">
      <div class="setting-row">
        <label for="id-zoteroscihub-scihub-url">Sci-Hub URL:</label>
        <input type="text" id="id-zoteroscihub-scihub-url" size="40" />
      </div>
    </div>
  </body>
</html>
